events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Upstream servers - usando servicios existentes
    upstream auth_backend {
        server crediya-auth-service:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream solicitudes_backend {
        server crediya-solicitudes-service:8081 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream reportes_backend {
        server crediya-reportes-service:8082 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Health check endpoint
    server {
        listen 80;
        server_name health.crediya.local;
        
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Nginx status for Prometheus
        location /nginx_status {
            stub_status on;
            access_log off;
            allow all;
        }
    }

    # Main Load Balancer Server (default)
    server {
        listen 80 default_server;
        server_name _;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Authentication Service
        location /auth/ {
            limit_req zone=auth burst=20 nodelay;
            
            proxy_pass http://auth_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Health check
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }

        # Solicitudes Service
        location /solicitudes/ {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass http://solicitudes_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Health check
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }

        # Reportes Service
        location /reportes/ {
            limit_req zone=api burst=30 nodelay;
            
            proxy_pass http://reportes_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Health check
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }

        # Health checks for services
        location /health/auth {
            proxy_pass http://auth_backend/actuator/health;
            access_log off;
        }

        location /health/solicitudes {
            proxy_pass http://solicitudes_backend/actuator/health;
            access_log off;
        }

        location /health/reportes {
            proxy_pass http://reportes_backend/actuator/health;
            access_log off;
        }

        # Default location
        location / {
            return 200 '{"message": "CREDIYA HU10 Load Balancer", "status": "operational", "services": ["/auth/", "/solicitudes/", "/reportes/"], "health_checks": ["/health/auth", "/health/solicitudes", "/health/reportes"], "info": "Use /health/{service} for health checks"}';
            add_header Content-Type application/json;
        }
    }
}
