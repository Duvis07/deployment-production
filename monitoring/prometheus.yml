global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter (System metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Authentication Service
  - job_name: 'authentication-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
        - 'crediya-auth-service:8080'
    scrape_interval: 10s

  # Solicitudes Service
  - job_name: 'solicitudes-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
        - 'crediya-solicitudes-service:8081'
    scrape_interval: 10s

  # Reportes Service
  - job_name: 'reportes-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
        - 'crediya-reportes-service:8082'
    scrape_interval: 10s

  # Nginx Load Balancer
  - job_name: 'nginx-load-balancer'
    static_configs:
      - targets: ['crediya-nginx-lb-hu10:80']
    metrics_path: '/nginx_status'
    scrape_interval: 30s

  # PostgreSQL Databases
  - job_name: 'postgres-auth'
    static_configs:
      - targets: ['crediya-postgres-auth:5432']
    scrape_interval: 30s

  - job_name: 'postgres-solicitudes'
    static_configs:
      - targets: ['crediya-postgres-solicitudes:5432']
    scrape_interval: 30s

  # LocalStack (AWS Services)
  - job_name: 'localstack'
    static_configs:
      - targets: ['crediya-localstack:4566']
    metrics_path: '/_localstack/health'
    scrape_interval: 30s
