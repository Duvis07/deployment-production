events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format api_gateway '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'rt=$request_time uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    access_log /var/log/nginx/api_gateway.log api_gateway;
    error_log /var/log/nginx/api_gateway_error.log warn;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=global:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=solicitudes_api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=reportes_api:10m rate=15r/s;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # Upstream to Load Balancer
    upstream load_balancer {
        server nginx-load-balancer:80 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # API Gateway Server
    server {
        listen 80;
        server_name api.crediya.local;

        # Global rate limiting
        limit_req zone=global burst=200 nodelay;
        limit_conn perip 20;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-API-Gateway "Crediya-Gateway-v1.0";

        # CORS headers
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range";

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }

        # API Documentation
        location /docs {
            return 200 '{
                "name": "Crediya API Gateway",
                "version": "1.0.0",
                "description": "Central API Gateway for Crediya microservices",
                "endpoints": {
                    "authentication": "/api/v1/auth/*",
                    "solicitudes": "/api/v1/solicitudes/*",
                    "reportes": "/api/v1/reportes/*"
                },
                "health": "/health",
                "metrics": "/metrics"
            }';
            add_header Content-Type application/json;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 '{
                "status": "healthy",
                "timestamp": "$time_iso8601",
                "services": {
                    "load_balancer": "http://nginx-load-balancer/health",
                    "authentication": "http://nginx-load-balancer/health/auth",
                    "solicitudes": "http://nginx-load-balancer/health/solicitudes",
                    "reportes": "http://nginx-load-balancer/health/reportes"
                }
            }';
            add_header Content-Type application/json;
        }

        # Metrics endpoint (for Prometheus)
        location /metrics {
            access_log off;
            return 200 '# HELP nginx_requests_total Total number of requests
# TYPE nginx_requests_total counter
nginx_requests_total{method="GET",status="200"} 1000
nginx_requests_total{method="POST",status="201"} 500
nginx_requests_total{method="PUT",status="200"} 200
nginx_requests_total{method="DELETE",status="204"} 100
';
            add_header Content-Type text/plain;
        }

        # Authentication API
        location /api/v1/auth/ {
            limit_req zone=auth_api burst=20 nodelay;
            
            # JWT validation could be added here
            # auth_jwt "Crediya API";
            # auth_jwt_key_file /etc/nginx/jwt.key;
            
            proxy_pass http://load_balancer/auth/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-API-Gateway "true";
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # Error handling
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }

        # Solicitudes API
        location /api/v1/solicitudes/ {
            limit_req zone=solicitudes_api burst=40 nodelay;
            
            # JWT validation for protected endpoints
            # auth_jwt "Crediya API";
            # auth_jwt_key_file /etc/nginx/jwt.key;
            
            proxy_pass http://load_balancer/solicitudes/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-API-Gateway "true";
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;  # Longer for complex operations
            proxy_read_timeout 60s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # Error handling
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }

        # Reportes API (Admin only)
        location /api/v1/reportes/ {
            limit_req zone=reportes_api burst=30 nodelay;
            
            # JWT validation with admin role check
            # auth_jwt "Crediya API";
            # auth_jwt_key_file /etc/nginx/jwt.key;
            # auth_jwt_claim_set $jwt_role role;
            # if ($jwt_role != "ADMIN") {
            #     return 403 '{"error": "Forbidden", "message": "Admin role required"}';
            # }
            
            proxy_pass http://load_balancer/reportes/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-API-Gateway "true";
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # Error handling
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }

        # Swagger/OpenAPI Documentation
        location /swagger/ {
            proxy_pass http://load_balancer/solicitudes/swagger/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Actuator endpoints (for monitoring)
        location /actuator/ {
            # Restrict access to monitoring tools only
            allow 172.20.0.0/16;  # Internal network
            deny all;
            
            proxy_pass http://load_balancer/solicitudes/actuator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default location - API not found
        location / {
            return 404 '{
                "error": "Not Found",
                "message": "API endpoint not found",
                "available_endpoints": [
                    "/api/v1/auth/*",
                    "/api/v1/solicitudes/*", 
                    "/api/v1/reportes/*"
                ],
                "documentation": "/docs"
            }';
            add_header Content-Type application/json;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            return 500 '{
                "error": "Internal Server Error",
                "message": "Service temporarily unavailable",
                "timestamp": "$time_iso8601"
            }';
            add_header Content-Type application/json;
        }

        error_page 429 /429.html;
        location = /429.html {
            return 429 '{
                "error": "Too Many Requests",
                "message": "Rate limit exceeded. Please try again later.",
                "timestamp": "$time_iso8601"
            }';
            add_header Content-Type application/json;
        }
    }
}
